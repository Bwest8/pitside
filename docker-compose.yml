# PitSide — Sportsman 820 Wi-Fi deck
# ZimaOS: copy this folder onto the Blade, then
# Apps → + → Install a customized app → import this file.
# Phone: http://<blade-address>:8080

services:
  pitside:
    build: .
    image: pitside:latest
    container_name: pitside
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      NITRO_HOST: "0.0.0.0"
      NITRO_PORT: "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

x-casaos:
  architectures:
    - amd64
  main: pitside
  title:
    en_us: PitSide
  description:
    en_us: Sportsman 820 Wi-Fi command deck
  port_map: "8080"
  index: /
  category: DIY
