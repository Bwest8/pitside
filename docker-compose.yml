# PitSide — PB0820SPW
# http://<host>:42069

services:
  pitside:
    build: .
    image: pitside:latest
    container_name: pitside
    restart: unless-stopped
    ports:
      - "42069:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      NITRO_HOST: "0.0.0.0"
      NITRO_PORT: "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

x-casaos:
  architectures:
    - amd64
  main: pitside
  title:
    en_us: PitSide
  description:
    en_us: Sportsman 820 Wi-Fi command deck
  port_map: "42069"
  index: /
  category: DIY
